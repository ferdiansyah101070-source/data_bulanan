<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Keuangan Bulanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="tag"><i></i>Financial Dashboard</div>
            <h1>Manajemen Keuangan</h1>
            <p class="subtitle">Catat pemasukan dan pengeluaran bulanan</p>
        </header>

        <!-- Main Layout: Left Content + Right Sidebar -->
        <div class="main-layout">
            <!-- LEFT: Form, Filter, Transactions -->
            <main class="content-left">
                <!-- Form Input -->
                <div class="form-section">
                    <h2>Tambah Transaksi</h2>
                    <form id="transactionForm">
                        <div class="form-group">
                            <label>Tipe Transaksi</label>
                            <select id="type" required>
                                <option value="pemasukan">Pemasukan</option>
                                <option value="pengeluaran">Pengeluaran</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Jumlah</label>
                                <input type="number" id="amount" placeholder="100000" required>
                            </div>
                            <div class="form-group">
                                <label>Tanggal</label>
                                <input type="date" id="transaction_date" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Kategori</label>
                            <input type="text" id="category" placeholder="Gaji, Makanan, Transport..." required>
                        </div>
                        <div class="form-group">
                            <label>Keterangan</label>
                            <input type="text" id="description" placeholder="Deskripsi transaksi (opsional)">
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="btn-primary" id="submitBtn">Tambah Transaksi</button>
                            <button type="button" class="btn-secondary" id="cancelBtn" style="display:none;">Batal</button>
                        </div>
                    </form>
                </div>

                <!-- Filters -->
                <div class="filters">
                    <h2>Filter Transaksi</h2>
                    <div class="filter-grid">
                        <div class="form-group">
                            <label>Tahun</label>
                            <select id="filterYear">
                                <option value="">Semua Tahun</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Bulan</label>
                            <select id="filterMonth">
                                <option value="">Semua Bulan</option>
                                <option value="1">Januari</option>
                                <option value="2">Februari</option>
                                <option value="3">Maret</option>
                                <option value="4">April</option>
                                <option value="5">Mei</option>
                                <option value="6">Juni</option>
                                <option value="7">Juli</option>
                                <option value="8">Agustus</option>
                                <option value="9">September</option>
                                <option value="10">Oktober</option>
                                <option value="11">November</option>
                                <option value="12">Desember</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tipe</label>
                            <select id="filterType">
                                <option value="">Semua Tipe</option>
                                <option value="pemasukan">Pemasukan</option>
                                <option value="pengeluaran">Pengeluaran</option>
                            </select>
                        </div>
                        <button class="btn-filter" onclick="applyFilters()">Terapkan</button>
                    </div>
                </div>

                <!-- Transactions List -->
                <div class="transactions-section">
                    <div class="section-header">
                        <h2>Riwayat Transaksi</h2>
                        <div class="tag"><i></i>Terbaru</div>
                    </div>
                    <div id="transactionsList" class="transactions-list">
                        <div class="loading">Memuat data...</div>
                    </div>
                </div>
            </main>

            <!-- RIGHT: Summary Cards (Sticky) -->
            <aside class="sidebar-right">
                <div class="summary-cards-vertical">
                    <div class="card saldo">
                        <div class="card-label">Saldo Anda</div>
                        <div class="card-value" id="saldo">Rp 0</div>
                        <div class="card-hint">Total keseluruhan</div>
                    </div>
                    
                    <div class="card pemasukan">
                        <div class="card-label">Pemasukan</div>
                        <div class="card-value" id="pemasukan">Rp 0</div>
                        <div class="card-hint">Total masuk</div>
                    </div>
                    
                    <div class="card pengeluaran">
                        <div class="card-label">Pengeluaran</div>
                        <div class="card-value" id="pengeluaran">Rp 0</div>
                        <div class="card-hint">Total keluar</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
